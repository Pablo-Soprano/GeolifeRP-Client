name: Build SAMP APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install libs for old NDK
        run: sudo apt-get update && sudo apt-get install -y libncurses5 libtinfo5
      - name: Get NDK r14b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q android-ndk-r14b-linux-x86_64.zip
      - name: Build libsamp.so
        run: |
          unzip -q SAMP-Master.zip -d src
          cd src
          ../android-ndk-r14b/ndk-build -j4
          ls -la libs/armeabi-v7a/
      - name: Replace lib in APK and sign
        run: |
          APK="$(ls *.apk | head -1)"
          cp "$APK" GeoLifeRP.apk
          mkdir -p pack/lib/armeabi-v7a
          cp src/libs/armeabi-v7a/libsamp.so pack/lib/armeabi-v7a/
          (cd pack && zip -q ../GeoLifeRP.apk lib/armeabi-v7a/libsamp.so)
          zip -q -d GeoLifeRP.apk 'META-INF/*' || true
          BT="$(ls -d $ANDROID_HOME/build-tools/* | tail -1)"
          $BT/zipalign -f 4 GeoLifeRP.apk aligned.apk
          keytool -genkeypair -keystore my.jks -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=GeoLifeRP"
          $BT/apksigner sign --ks my.jks --ks-pass pass:123456 --out GeoLifeRP-signed.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLifeRP-apk
          path: GeoLifeRP-signed.apk
